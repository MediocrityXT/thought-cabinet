openapi: 3.1.0
info:
  title: ThoughtCabinet Core API
  version: 1.0.0
  description: API for ThoughtCabinet, supporting multiple frontend prototypes (NEON, ZEN, etc.) with a Markdown-based backend.
servers:
  - url: http://localhost:8000/api
    description: Local development server

paths:
  /health:
    get:
      summary: Health status for the running cognitive core
      operationId: getHealth
      responses:
        '200':
          description: Current runtime health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /dashboard/overview:
    get:
      summary: Get dashboard overview data for the NEON command center
      operationId: getDashboardOverview
      responses:
        '200':
          description: Dashboard aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'

  /blueprint/graph:
    get:
      summary: Get knowledge blueprint graph
      operationId: getBlueprintGraph
      responses:
        '200':
          description: Graph nodes and edges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintGraph'

  /config/theme:
    get:
      summary: Get active theme
      operationId: getTheme
      responses:
        '200':
          description: Active theme configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeConfig'
    put:
      summary: Update active theme
      operationId: updateTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeConfig'
      responses:
        '200':
          description: Theme updated successfully

  /notes:
    get:
      summary: List all knowledge nodes/notes
      operationId: listNotes
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteMetadata'
    post:
      summary: Create a new note
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

  /notes/{id}:
    get:
      summary: Get note by ID
      operationId: getNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Note content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
    put:
      summary: Update note content incrementally or fully
      operationId: updateNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
      responses:
        '200':
          description: Note updated

  /tasks:
    get:
      summary: List tasks
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /tasks/{id}:
    put:
      summary: Update an existing task
      operationId: updateTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /evaluations:
    get:
      summary: List all evaluated ideas
      operationId: listEvaluations
      responses:
        '200':
          description: Evaluations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evaluation'
    post:
      summary: Request AI evaluation for a new idea
      operationId: createEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idea:
                  type: string
      responses:
        '201':
          description: Evaluation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'

  /refinery/materials:
    get:
      summary: List reading materials in refinery
      operationId: listMaterials
      responses:
        '200':
          description: Materials list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
    post:
      summary: Add new reading material
      operationId: addMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreate'
      responses:
        '201':
          description: Material added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'

  /refinery/materials/{id}:
    get:
      summary: Get reading material by ID
      operationId: getMaterial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Material content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'

  /refinery/conversations:
    get:
      summary: List AI conversations for refining ideas
      operationId: listConversations
      responses:
        '200':
          description: Conversations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationMetadata'
    post:
      summary: Start a new conversation
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initialMessage:
                  type: string
                contextId:
                  type: string
                  description: Optional ID of a material or note to provide context
      responses:
        '201':
          description: Conversation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /refinery/conversations/{id}:
    get:
      summary: Get a single AI conversation
      operationId: getConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /refinery/conversations/{id}/messages:
    post:
      summary: Send message to AI and get stream/response
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, system]
                content:
                  type: string
      responses:
        '200':
          description: AI Response appended to conversation

components:
  schemas:
    ThemeConfig:
      type: object
      properties:
        activeTheme:
          type: string
          enum: [NEON, ZEN, EPOCH, GLITCH, SKY, AURA, AUGURY, LIBRARY, ATELIER, PRISM, FORGE, VOID, HOME, WARROOM]
          example: NEON

    NoteMetadata:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        domain:
          type: string
        type:
          type: string
          enum: [known, unknown, gap]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Note:
      allOf:
        - $ref: '#/components/schemas/NoteMetadata'
        - type: object
          properties:
            content:
              type: string
              description: Markdown content

    NoteCreate:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
        content:
          type: string
        domain:
          type: string
        type:
          type: string
        tags:
          type: array
          items:
            type: string

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
          description: Content to append or replace
        append:
          type: boolean
          description: If true, append content to the existing Markdown file.
        domain:
          type: string
        type:
          type: string

    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        domain:
          type: string
        timeEstimate:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [todo, in_progress, done]
        category:
          type: string
          enum: [review, focus, alert, quick_win]
        impactScore:
          type: integer
        progress:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskCreate:
      type: object
      required:
        - title
        - domain
        - timeEstimate
      properties:
        title:
          type: string
        domain:
          type: string
        timeEstimate:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [todo, in_progress, done]
        category:
          type: string
          enum: [review, focus, alert, quick_win]
        impactScore:
          type: integer
        progress:
          type: integer

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        domain:
          type: string
        timeEstimate:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [todo, in_progress, done]
        category:
          type: string
          enum: [review, focus, alert, quick_win]
        impactScore:
          type: integer
        progress:
          type: integer

    Evaluation:
      type: object
      properties:
        id:
          type: string
        idea:
          type: string
        impact:
          type: integer
        feasibility:
          type: integer
        domain:
          type: string
        status:
          type: string
          enum: [idea, evaluating, active, archived]
        assessment:
          type: object
          properties:
            strengths:
              type: array
              items:
                type: string
            weaknesses:
              type: array
              items:
                type: string
            opportunities:
              type: array
              items:
                type: string
            threats:
              type: array
              items:
                type: string
            roastComment:
              type: string
            scores:
              type: object
              properties:
                innovation:
                  type: integer
                market:
                  type: integer
                feasibility:
                  type: integer
                team:
                  type: integer

    Material:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        sourceUrl:
          type: string
        content:
          type: string
          description: Extracted markdown content
        summary:
          type: string
        status:
          type: string
          enum: [unread, reading, refined]

    MaterialCreate:
      type: object
      required:
        - sourceUrl
      properties:
        sourceUrl:
          type: string
        title:
          type: string

    ConversationMetadata:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time

    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationMetadata'
        - type: object
          properties:
            contextId:
              type: string
            messages:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                    enum: [user, assistant, system]
                  content:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
            content:
              type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
        health:
          type: integer
        updatedAt:
          type: string
          format: date-time

    DashboardStats:
      type: object
      properties:
        totalNotes:
          type: integer
        pendingReview:
          type: integer
        highValue:
          type: integer
        cognitiveGaps:
          type: integer

    ProgressEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [cognitive, task, system]
        title:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        score:
          type: integer

    DashboardOverview:
      type: object
      properties:
        vaultPath:
          type: string
        health:
          type: integer
        stats:
          $ref: '#/components/schemas/DashboardStats'
        recentProgress:
          type: array
          items:
            $ref: '#/components/schemas/ProgressEvent'
        reviewQueue:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        focusProjects:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        cognitiveAlerts:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        quickWins:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    GraphNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [known, unknown, gap]
        domain:
          type: string
        tags:
          type: array
          items:
            type: string

    GraphEdge:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        label:
          type: string

    BlueprintGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
