openapi: 3.1.0
info:
  title: ThoughtCabinet Core API
  version: 0.1
  description: API for ThoughtCabinet, supporting multiple frontend prototypes (NEON, ZEN, etc.) with a Markdown-based backend.
servers:
  - url: http://localhost:8000/api
    description: Local development server

paths:
  /health:
    get:
      summary: Health status for the running cognitive core
      operationId: getHealth
      responses:
        '200':
          description: Current runtime health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /dashboard/overview:
    get:
      summary: Get dashboard overview data for the NEON command center
      operationId: getDashboardOverview
      responses:
        '200':
          description: Dashboard aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'

  /workspace:
    get:
      summary: Get one-shot workspace snapshot for initial app hydration
      operationId: getWorkspaceSnapshot
      responses:
        '200':
          description: Aggregated workspace payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSnapshot'

  /blueprint/graph:
    get:
      summary: Get knowledge blueprint graph
      operationId: getBlueprintGraph
      responses:
        '200':
          description: Graph nodes and edges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintGraph'

  /planner/board:
    get:
      summary: Get tactical planner board with strategic tree, current brief and AI schedule preview
      operationId: getPlannerBoard
      parameters:
        - name: evaluationId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Planner board state for the selected project goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerBoard'

  /planner/assign:
    post:
      summary: Let AI assign the best next task for the available time budget
      operationId: assignPlannerTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerAssignRequest'
      responses:
        '200':
          description: Recommended node and brief for immediate execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerAssignment'

  /planner/goals/{evaluationId}/brief:
    get:
      summary: Build a mission brief for a strategic goal or sub-goal
      operationId: getPlannerBrief
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema:
            type: string
        - name: nodeId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Mission brief with objective, context and linked materials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerBrief'

  /planner/goals/{evaluationId}/feedback:
    get:
      summary: List execution feedback logs for a goal
      operationId: listPlannerFeedback
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ordered execution feedback timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlannerFeedback'
    post:
      summary: Append execution feedback and allow AI to adapt future tasks
      operationId: createPlannerFeedback
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerFeedbackCreate'
      responses:
        '201':
          description: Stored feedback entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerFeedback'

  /planner/goals/{evaluationId}/schedule:
    get:
      summary: Get AI-generated schedule preview and procrastination heatmap for a goal
      operationId: getPlannerSchedule
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule preview merged with delay analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerSchedule'

  /planner/goals/{evaluationId}/chat:
    post:
      summary: Discuss schedule or plan adjustments with the planner copilot
      operationId: chatPlannerGoal
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerChatRequest'
      responses:
        '200':
          description: Updated planner board after AI-assisted schedule discussion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerBoard'

  /config/theme:
    get:
      summary: Get active theme
      operationId: getTheme
      responses:
        '200':
          description: Active theme configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeConfig'
    put:
      summary: Update active theme
      operationId: updateTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeConfig'
      responses:
        '200':
          description: Theme updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeConfig'

  /settings:
    get:
      summary: Get active theme, vault and LLM settings
      operationId: getSettings
      responses:
        '200':
          description: Runtime settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsPayload'
    put:
      summary: Update application settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsPayload'

  /vaults:
    get:
      summary: List available vaults
      operationId: listVaults
      responses:
        '200':
          description: Vault list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VaultSummary'

  /vaults/create:
    post:
      summary: Create a new empty vault
      operationId: createVault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultCreateRequest'
      responses:
        '201':
          description: Created vault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultSummary'

  /vaults/select:
    post:
      summary: Switch active vault
      operationId: selectVault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultSelectRequest'
      responses:
        '200':
          description: Active vault summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultSummary'

  /notes:
    get:
      summary: List all knowledge nodes/notes
      operationId: listNotes
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteMetadata'
    post:
      summary: Create a new note
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

  /notes/{id}:
    get:
      summary: Get note by ID
      operationId: getNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Note content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
    put:
      summary: Update note content incrementally or fully
      operationId: updateNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
      responses:
        '200':
          description: Note updated

  /tasks:
    get:
      summary: List tasks
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /tasks/{id}:
    put:
      summary: Update an existing task
      operationId: updateTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /evaluations:
    get:
      summary: List all evaluated ideas
      operationId: listEvaluations
      responses:
        '200':
          description: Evaluations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evaluation'
    post:
      summary: Request AI evaluation for a new idea
      operationId: createEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idea:
                  type: string
      responses:
        '201':
          description: Evaluation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'

  /refinery/materials:
    get:
      summary: List reading materials in refinery
      operationId: listMaterials
      responses:
        '200':
          description: Materials list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
    post:
      summary: Add new reading material
      operationId: addMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreate'
      responses:
        '201':
          description: Material added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'

  /refinery/intake:
    post:
      summary: Intake pasted URL or raw text and open a refinery session
      operationId: intakeRefineryMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefineryIntakeRequest'
      responses:
        '201':
          description: Refinery session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefinerySession'

  /refinery/settings:
    get:
      summary: Get refinery prompt settings
      operationId: getRefinerySettings
      responses:
        '200':
          description: Prompt settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefinerySettings'
    put:
      summary: Update refinery prompt settings
      operationId: updateRefinerySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefinerySettingsUpdate'
      responses:
        '200':
          description: Prompt settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefinerySettings'

  /refinery/materials/{id}:
    get:
      summary: Get reading material by ID
      operationId: getMaterial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Material content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
    put:
      summary: Update refinery material metadata such as editable report
      operationId: updateRefineryMaterial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialUpdate'
      responses:
        '200':
          description: Material updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'

  /refinery/conversations:
    get:
      summary: List AI conversations for refining ideas
      operationId: listConversations
      responses:
        '200':
          description: Conversations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationMetadata'
    post:
      summary: Start a new conversation
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initialMessage:
                  type: string
                contextId:
                  type: string
                  description: Optional ID of a material or note to provide context
      responses:
        '201':
          description: Conversation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /refinery/conversations/{id}:
    get:
      summary: Get a single AI conversation
      operationId: getConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /refinery/conversations/{id}/messages:
    post:
      summary: Send message to AI and get stream/response
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, system]
                content:
                  type: string
      responses:
        '200':
          description: AI Response appended to conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /refinery/conversations/{id}/reset:
    post:
      summary: Reset a refinery conversation back to the report seed
      operationId: resetRefineryConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /refinery/conversations/{id}/publish-note:
    post:
      summary: Publish the refined material and conversation as a permanent note
      operationId: publishRefineryNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Permanent note created from refinery session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

components:
  schemas:
    ThemeConfig:
      type: object
      properties:
        activeTheme:
          type: string
          enum: [NEON, ZEN, EPOCH, GLITCH, SKY, AURA, AUGURY, LIBRARY, ATELIER, PRISM, FORGE, VOID, HOME, WARROOM]
          example: NEON

    ModuleModels:
      type: object
      properties:
        dashboard:
          type: string
        refinery:
          type: string
        organizer:
          type: string
        evaluator:
          type: string
        blueprint:
          type: string
        planner:
          type: string

    LLMSettings:
      type: object
      properties:
        baseUrl:
          type: string
        apiKey:
          type: string
        defaultModel:
          type: string
        moduleModels:
          $ref: '#/components/schemas/ModuleModels'
        apiConfigPath:
          type: string

    VaultSummary:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        isObsidian:
          type: boolean
        gitInitialized:
          type: boolean
        noteCount:
          type: integer
        appDataPath:
          type: string

    SettingsPayload:
      type: object
      properties:
        activeTheme:
          type: string
          enum: [NEON, ZEN, EPOCH, GLITCH, SKY, AURA, AUGURY, LIBRARY, ATELIER, PRISM, FORGE, VOID, HOME, WARROOM]
        vault:
          $ref: '#/components/schemas/VaultSummary'
        availableVaults:
          type: array
          items:
            $ref: '#/components/schemas/VaultSummary'
        llm:
          $ref: '#/components/schemas/LLMSettings'

    SettingsUpdate:
      type: object
      properties:
        activeTheme:
          type: string
          enum: [NEON, ZEN, EPOCH, GLITCH, SKY, AURA, AUGURY, LIBRARY, ATELIER, PRISM, FORGE, VOID, HOME, WARROOM]
        activeVaultPath:
          type: string
        llm:
          $ref: '#/components/schemas/LLMSettings'

    VaultCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    VaultSelectRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string

    NoteMetadata:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        domain:
          type: string
        type:
          type: string
          enum: [known, unknown, gap]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Note:
      allOf:
        - $ref: '#/components/schemas/NoteMetadata'
        - type: object
          properties:
            content:
              type: string
              description: Markdown content

    NoteCreate:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
        content:
          type: string
        domain:
          type: string
        type:
          type: string
        tags:
          type: array
          items:
            type: string

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
          description: Content to append or replace
        append:
          type: boolean
          description: If true, append content to the existing Markdown file.
        domain:
          type: string
        type:
          type: string

    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        domain:
          type: string
        timeEstimate:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [todo, in_progress, done]
        category:
          type: string
          enum: [review, focus, alert, quick_win]
        impactScore:
          type: integer
        progress:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskCreate:
      type: object
      required:
        - title
        - domain
        - timeEstimate
      properties:
        title:
          type: string
        domain:
          type: string
        timeEstimate:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [todo, in_progress, done]
        category:
          type: string
          enum: [review, focus, alert, quick_win]
        impactScore:
          type: integer
        progress:
          type: integer

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        domain:
          type: string
        timeEstimate:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [todo, in_progress, done]
        category:
          type: string
          enum: [review, focus, alert, quick_win]
        impactScore:
          type: integer
        progress:
          type: integer

    Evaluation:
      type: object
      properties:
        id:
          type: string
        idea:
          type: string
        impact:
          type: integer
        feasibility:
          type: integer
        domain:
          type: string
        status:
          type: string
          enum: [idea, evaluating, active, archived]
        assessment:
          type: object
          properties:
            strengths:
              type: array
              items:
                type: string
            weaknesses:
              type: array
              items:
                type: string
            opportunities:
              type: array
              items:
                type: string
            threats:
              type: array
              items:
                type: string
            roastComment:
              type: string
            scores:
              type: object
              properties:
                innovation:
                  type: integer
                market:
                  type: integer
                feasibility:
                  type: integer
                team:
                  type: integer

    Material:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        sourceUrl:
          type: string
        content:
          type: string
          description: Extracted markdown content
        summary:
          type: string
        status:
          type: string
          enum: [unread, reading, refined]
        report:
          type: string
          description: Short AI-generated refinery report used to seed the discussion

    MaterialCreate:
      type: object
      required:
        - input
      properties:
        input:
          type: string
          description: A URL or raw text pasted by the user
        title:
          type: string
        kind:
          type: string
          enum: [url, text]

    MaterialUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        report:
          type: string
        summary:
          type: string
        status:
          type: string
          enum: [unread, reading, refined]

    RefinerySettings:
      type: object
      properties:
        defaultPrompt:
          type: string

    RefinerySettingsUpdate:
      type: object
      required:
        - defaultPrompt
      properties:
        defaultPrompt:
          type: string

    RefineryIntakeRequest:
      type: object
      required:
        - input
      properties:
        input:
          type: string
        title:
          type: string

    RefinerySession:
      type: object
      properties:
        material:
          $ref: '#/components/schemas/Material'
        conversation:
          $ref: '#/components/schemas/Conversation'
        settings:
          $ref: '#/components/schemas/RefinerySettings'

    ConversationMetadata:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time

    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationMetadata'
        - type: object
          properties:
            contextId:
              type: string
            messages:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                    enum: [user, assistant, system]
                  content:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
            content:
              type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
        health:
          type: integer
        updatedAt:
          type: string
          format: date-time

    DashboardStats:
      type: object
      properties:
        totalNotes:
          type: integer
        pendingReview:
          type: integer
        highValue:
          type: integer
        cognitiveGaps:
          type: integer

    ProgressEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [cognitive, task, system]
        title:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        score:
          type: integer

    DashboardOverview:
      type: object
      properties:
        vaultPath:
          type: string
        health:
          type: integer
        stats:
          $ref: '#/components/schemas/DashboardStats'
        recentProgress:
          type: array
          items:
            $ref: '#/components/schemas/ProgressEvent'
        reviewQueue:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        focusProjects:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        cognitiveAlerts:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        quickWins:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    WorkspaceSnapshot:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/SettingsPayload'
        overview:
          $ref: '#/components/schemas/DashboardOverview'
        graph:
          $ref: '#/components/schemas/BlueprintGraph'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/Evaluation'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        conversationMetas:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMetadata'
        activeConversation:
          oneOf:
            - $ref: '#/components/schemas/Conversation'
            - type: 'null'

    GraphNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [known, unknown, gap]
        domain:
          type: string
        tags:
          type: array
          items:
            type: string

    GraphEdge:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        label:
          type: string

    BlueprintGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'

    PlannerNode:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        detail:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done, blocked]
        ddl:
          type: string
          format: date-time
        parentId:
          type: string
        depth:
          type: integer
        timeEstimate:
          type: integer
        taskId:
          type: string

    PlannerBrief:
      type: object
      properties:
        evaluationId:
          type: string
        nodeId:
          type: string
        title:
          type: string
        minimumOutcome:
          type: string
        contextSummary:
          type: string
        docLinks:
          type: array
          items:
            type: string
        prerequisiteNotes:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMetadata'
        relatedTaskIds:
          type: array
          items:
            type: string

    PlannerFeedback:
      type: object
      properties:
        id:
          type: string
        evaluationId:
          type: string
        nodeId:
          type: string
        taskId:
          type: string
        status:
          type: string
          enum: [started, progress, blocked, done, adjusted]
        progressNote:
          type: string
        blocker:
          type: string
        nextSuggestion:
          type: string
        actualMinutes:
          type: integer
        createdAt:
          type: string
          format: date-time

    PlannerFeedbackCreate:
      type: object
      required: [nodeId, status, progressNote]
      properties:
        nodeId:
          type: string
        taskId:
          type: string
        status:
          type: string
          enum: [started, progress, blocked, done, adjusted]
        progressNote:
          type: string
        blocker:
          type: string
        actualMinutes:
          type: integer

    PlannerScheduleBlock:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        reason:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        energy:
          type: string
          enum: [low, medium, high]
        nodeId:
          type: string

    PlannerHeatmapCell:
      type: object
      properties:
        domain:
          type: string
        rate:
          type: integer
        tasks:
          type: integer

    PlannerSchedule:
      type: object
      properties:
        evaluationId:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PlannerScheduleBlock'
        heatmap:
          type: array
          items:
            $ref: '#/components/schemas/PlannerHeatmapCell'
        summary:
          type: string

    PlannerAssignment:
      type: object
      properties:
        evaluationId:
          type: string
        selectedNode:
          $ref: '#/components/schemas/PlannerNode'
        brief:
          $ref: '#/components/schemas/PlannerBrief'
        rationale:
          type: string

    PlannerAssignRequest:
      type: object
      required: [minutes]
      properties:
        evaluationId:
          type: string
        minutes:
          type: integer

    PlannerChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string

    PlannerBoard:
      type: object
      properties:
        evaluationId:
          type: string
        goalTitle:
          type: string
        goalDdl:
          type: string
          format: date-time
        activeNodeId:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PlannerNode'
        brief:
          $ref: '#/components/schemas/PlannerBrief'
        schedule:
          $ref: '#/components/schemas/PlannerSchedule'
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/PlannerFeedback'
